name: fix map player view once

on:
  push:
    branches: [feature/delayed-communications]
    paths:
      - .github/workflows/fix-map-player-view-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: [self-hosted, Linux, X64, suns]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move every fleet map overlay to delayed player view
        run: python3 scripts/fix_map_player_view_once.py
