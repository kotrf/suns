name: fix communications once

on:
  push:
    branches: [feature/delayed-communications]
    paths:
      - .github/workflows/fix-communications-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: [self-hosted, Linux, X64, suns]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Harden communications branch
        run: python3 scripts/fix_communications_once.py
